<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vak</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Chats">
        <div class="side-top" data-tauri-drag-region>
          <span class="brand" data-tauri-drag-region><img src="/icon.svg" alt="" width="20" height="20" data-tauri-drag-region />vak</span>
          <button type="button" class="icon-btn" id="collapse" title="Hide sidebar (⌘\)" aria-label="Hide sidebar"></button>
        </div>
        <div class="side-head">
          <button type="button" class="new" id="new-chat" title="New chat (⌘N)">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            New chat
          </button>
        </div>
        <div class="side-pages"><button type="button" class="quiet" id="open-artifacts" aria-current="false"></button></div>
        <nav id="chats" class="chats" aria-label="Recent chats"></nav>
        <div class="side-foot">
          <button type="button" class="quiet" id="open-settings" title="Settings (⌘,)">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Settings
          </button>
        </div>
      </aside>

      <div class="workspace" id="workspace">
      <section class="main">
        <div class="drag" data-tauri-drag-region>
          <button type="button" class="icon-btn" id="expand" title="Show sidebar (⌘\)" aria-label="Show sidebar"></button>
        </div>
        <main id="thread" class="thread" aria-live="polite"></main>

        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="Ask for anything" aria-label="Message"></textarea>
          <div class="composer-row">
            <select id="model-pick" class="model-pick" aria-label="Model" title="Model"></select>
            <button type="submit" id="send" class="send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
      </section>
      <div id="canvas-resize" class="canvas-resize" role="separator" aria-label="Resize canvas" aria-orientation="vertical" tabindex="0" hidden></div>
      <aside id="canvas" class="canvas" aria-label="Canvas" hidden>
        <header class="canvas-head">
          <div class="canvas-heading"><span class="canvas-label">Canvas</span><select id="canvas-pick" aria-label="Choose canvas"></select><h2 id="canvas-title" class="sr-only"></h2></div>
          <button type="button" class="icon-btn" id="canvas-expand" aria-label="Enter full view" title="Enter full view (⌘⇧F)" aria-pressed="false"></button>
          <button type="button" class="icon-btn" id="canvas-close" aria-label="Close canvas" title="Close canvas (Esc)"></button>
        </header>
        <div class="canvas-toolbar" role="group" aria-label="Canvas controls">
          <div class="seg" role="group" aria-label="Canvas view">
            <button type="button" id="canvas-preview" aria-pressed="true">Preview</button>
            <button type="button" id="canvas-text" aria-pressed="false">Text</button>
          </div>
          <span class="canvas-feedback" id="canvas-feedback" role="status"></span>
          <button type="button" class="icon-btn" id="canvas-copy" aria-label="Copy as text" title="Copy as text"></button>
          <button type="button" class="icon-btn" id="canvas-download" aria-label="Download Markdown" title="Download Markdown"></button>
        </div>
        <div id="canvas-progress" class="canvas-progress" role="status" hidden>Building the interface…</div>
        <div id="canvas-content" class="canvas-content"></div>
        <pre id="canvas-text-content" class="canvas-text-content" tabindex="0" aria-label="Canvas as text" hidden></pre>
      </aside>
      </div>
      <section id="artifacts-page" class="artifacts-page" aria-label="Artifacts" hidden></section>
    </div>

    <div id="settings" class="settings-page" hidden>
      <nav class="settings-nav" aria-label="Settings sections">
        <div class="settings-nav-head" data-tauri-drag-region>
          <button type="button" class="quiet back" id="settings-back" title="Back to chats (Esc)">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back to chats
          </button>
        </div>
        <div id="settings-nav-list" class="settings-nav-list"></div>
      </nav>
      <div class="settings-body">
        <div class="drag" data-tauri-drag-region></div>
        <div id="settings-content" class="settings-content"></div>
      </div>
    </div>

    <dialog id="ask" class="sheet small">
      <form method="dialog">
        <p id="ask-text"></p>
        <div class="actions">
          <button type="submit" class="ghost" value="no">Cancel</button>
          <button type="submit" class="primary" id="ask-ok" value="yes">Continue</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
