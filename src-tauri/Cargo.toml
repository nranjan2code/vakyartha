[package]
name = "vakyartha"
version = "0.2.0"
description = "Vakyartha: ask any model, get an interface"
authors = ["Nisheeth Ranjan"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "vakyartha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
