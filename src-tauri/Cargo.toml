[package]
name = "vakyartha"
version = "0.2.0"
description = "Vakyartha: ask any model, get an interface"
authors = ["Nisheeth Ranjan"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "vakyartha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "stream", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

